# OpenOCD config: STM8L101F3P6 over SWIM via ST-LINK/V2 (or STLINK-V3SET with SWIM adapter)
# Usage: openocd -f openocd/stm8l101f3.cfg -c "program build/main.ihx verify reset exit"

source [find interface/stlink.cfg]

# 1.5 KB RAM at 0x0000-0x05FF; keep 1 KB as flash-programming work area
set WORKAREASIZE 0x400

# 8 KB Flash at 0x8000-0x9FFF (the "data EEPROM" on STM8L101 lives inside this range)
set FLASHSTART  0x8000
set FLASHEND    0x9fff

# STM8L101 has no separate data EEPROM region; point the mandatory EEPROM bank
# at an unused address range so it is never touched.
set EEPROMSTART 0x1000
set EEPROMEND   0x10ff

set OPTIONSTART 0x4800
set OPTIONEND   0x487f
set BLOCKSIZE   0x40

source [find target/stm8l.cfg]
